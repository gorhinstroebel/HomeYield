<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#234b35" />
    <meta name="description" content="Your tap-first garden companion, backed by local SQLite." />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.json" />
    <title>HomeYield</title>
    <script>
      (() => {
        const saved = localStorage.getItem("homeyield-garden");
        if (!saved) return;
        try {
          const theme = JSON.parse(saved).theme;
          if (theme === "dark" || theme === "light") document.documentElement.dataset.theme = theme;
        } catch (error) {
          console.warn("HomeYield theme preference could not be read.", error);
        }
      })();
    </script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="app" aria-live="polite"></main>
    <script src="app.js?v=20260906"></script>
    <script>
      if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch((error) => console.warn("HomeYield offline shell unavailable.", error));
    </script>
  </body>
</html>
