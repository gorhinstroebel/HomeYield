[package]
name = "homeyield"
version = "1.0.1"
description = "A quiet, practical companion for caring for real plants."
authors = ["HomeYield"]
edition = "2021"

[lib]
name = "homeyield_lib"
path = "lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "homeyield"
path = "main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
